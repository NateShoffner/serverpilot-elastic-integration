wait_for_data_timeout: 1m
service: serverpilot-apache-error-filestream
input: filestream
data_stream:
  vars:
    paths:
      - '{{SERVICE_LOGS_DIR}}/srv/users/*/log/*/*_apache.error.log'
    preserve_original_event: true
numeric_keyword_fields:
  - log.file.device_id
  - log.file.inode
  - log.file.idxhi
  - log.file.idxlo
  - log.file.vol
assert:
  hit_count: 7
