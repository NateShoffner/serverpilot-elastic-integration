---
description: Pipeline for parsing ServerPilot app inventory records from the ServerPilot management API.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  # The CEL program emits one event per app from `GET /apps`, with the app object
  # encoded as a JSON string in `message`. `ssl.key`, `ssl.cert` and `ssl.cacerts`
  # are the app's TLS private key and certificate chain; they are already dropped in
  # CEL and are never recreated here. Only the `ssl.auto` and `ssl.force`
  # configuration booleans survive, so `event.original` carries no key material
  # either.
  - json:
      field: event.original
      tag: parse_json
      target_field: json
      if: ctx.event?.original != null

  # Splits the numeric PHP version out of the prefixed runtime string, for example
  # `8.3` from `php8.3`. This is what makes "find every app still on an end-of-life
  # PHP release" answerable, which a range query against the prefixed string cannot
  # do. It must agree with `serverpilot.php.version` in the `php_access`,
  # `php_error` and `php_slow` data streams, which derive the same value from the
  # log file name.
  #
  # `ignore_failure` is deliberate: ServerPilot's API reference still documents only
  # `php5.4` through `php7.2` while the service ships considerably newer runtimes, so
  # the value set is demonstrably not closed. A runtime that does not match the
  # `phpX.Y` shape must leave the version unset rather than fail the document.
  - grok:
      field: json.runtime
      tag: grok_app_runtime_version
      patterns:
        - '^php(?<serverpilot.app.runtime.version>[0-9]+(?:\.[0-9]+)?)$'
      ignore_missing: true
      ignore_failure: true
      description: Derives the numeric PHP version from the prefixed runtime string.
  - rename:
      field: json.runtime
      tag: rename_app_runtime_name
      target_field: serverpilot.app.runtime.name
      ignore_missing: true

  - rename:
      field: json.id
      tag: rename_app_id
      target_field: serverpilot.app.id
      ignore_missing: true
  - rename:
      field: json.name
      tag: rename_app_name
      target_field: serverpilot.app.name
      ignore_missing: true
      description: >-
        `serverpilot.app.name` is the authoritative vendor field and is spelled
        identically to the field the seven filestream data streams derive from
        `log.file.path`, which is what makes the two halves of the package join.

  # ServerPilot allows up to 300 domains per app, and they are the names the app is
  # configured to answer for rather than the domain of any URL in this event. They
  # are therefore kept in the vendor namespace and not written to ECS `url.domain`:
  # `url.*` describes one URL observed in one event, and an array of configured
  # names in `url.domain` would break every query and visualization that pairs
  # `url.domain` with `url.path` or `url.full`, including the sibling
  # `nginx_access` stream, which sets `url.domain` from the request Host header.
  #
  # ECS `tls.*` is rejected for the same class of reason: it describes an observed
  # TLS session or a certificate's contents, and this record contains neither. The
  # certificate material is dropped in CEL by design, so there is nothing to
  # populate `tls.server.x509.*` with, and `ssl.auto` and `ssl.force` are
  # ServerPilot configuration toggles rather than properties of a handshake.
  - rename:
      field: json.domains
      tag: rename_app_domains
      target_field: serverpilot.app.domains
      ignore_missing: true
  - rename:
      field: json.sysuserid
      tag: rename_sysuser_id
      target_field: serverpilot.sysuser.id
      ignore_missing: true
  - rename:
      field: json.serverid
      tag: rename_server_id
      target_field: serverpilot.server.id
      ignore_missing: true

  # `ssl` is an object for an app with a certificate and `null` for an app without
  # one, so its presence is the only signal that distinguishes the two once the key
  # material has been dropped. Both branches are set explicitly so that
  # `serverpilot.app.ssl.enabled` is always populated and "apps with no TLS at all"
  # is a positive query rather than a missing-field query.
  - set:
      field: serverpilot.app.ssl.enabled
      tag: set_app_ssl_enabled_true
      value: true
      if: ctx.json?.ssl != null
  - set:
      field: serverpilot.app.ssl.enabled
      tag: set_app_ssl_enabled_false
      value: false
      if: ctx.json != null && ctx.json.ssl == null
  # The `if` guards are what keep a null `ssl` working: `ignore_missing` only covers
  # an absent key, and renaming a key that is present with a null value fails.
  - rename:
      field: json.ssl.auto
      tag: rename_app_ssl_auto
      target_field: serverpilot.app.ssl.auto
      ignore_missing: true
      if: ctx.json?.ssl?.auto != null
  - rename:
      field: json.ssl.force
      tag: rename_app_ssl_force
      target_field: serverpilot.app.ssl.force
      ignore_missing: true
      if: ctx.json?.ssl?.force != null

  # `datecreated` is Unix epoch SECONDS, so the format is `UNIX` and not `UNIX_MS`;
  # parsing it as milliseconds would place every document in January 1970.
  #
  # It does not become `@timestamp`: `GET /apps` is a full-snapshot inventory
  # endpoint, so the event time is the collection time the agent stamps on the event.
  - date:
      field: json.datecreated
      tag: date_app_created
      target_field: serverpilot.app.created
      formats:
        - UNIX
      if: ctx.json?.datecreated != null
      on_failure:
        - append:
            field: error.message
            tag: append_date_app_created_failure
            value: '{{{_ingest.on_failure_message}}}'

  # `service.name` carries the app name on every data stream in this package. On the
  # seven filestream streams it comes from `log.file.path`; here it comes from the
  # API. That is what closes the join between the on-host logs and this inventory, so
  # the vendor field stays authoritative and `service.name` is a copy of it. The
  # other three API streams deliberately do not set `service.name`, because a server,
  # a system user and a database each relate to zero or many apps rather than one.
  - set:
      field: service.name
      tag: set_service_name_from_app_name
      copy_from: serverpilot.app.name
      if: ctx.serverpilot?.app?.name != null

  # `GET /apps` is a point-in-time inventory listing, so `event.kind` is `asset`
  # rather than `event`. The record describes how an app is configured (its runtime,
  # its domains and its TLS settings), which is `configuration`, and `info` because
  # it reports state rather than an action, so no `event.outcome` applies. The `web`
  # category is deliberately left to the access log streams so that querying
  # `event.category: web` returns requests and not inventory.
  - set:
      field: event.kind
      tag: set_event_kind
      value: asset
  - append:
      field: event.category
      tag: append_event_category_configuration
      value: configuration
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  - remove:
      field: json
      tag: remove_json
      ignore_missing: true
  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
