wait_for_data_timeout: 1m
input: cel
service: serverpilot-database-mock
vars:
  url: http://{{Hostname}}:{{Port}}
  client_id: example-client-id
  api_key: example-api-key
data_stream:
  vars:
    # GET /dbs is a full-snapshot endpoint: every poll re-reports every
    # database. A short interval would make the hit count non-deterministic
    # (one extra copy of the whole inventory per poll inside the wait window),
    # so the production default is kept here. The CEL input evaluates once
    # immediately on start, which is the single collection this test asserts on.
    interval: 1h
    preserve_original_event: true
assert:
  hit_count: 3
