- name: serverpilot
  type: group
  fields:
    - name: sysuser.name
      type: keyword
      description: >-
        Name of the ServerPilot system user that owns the app the request was served for. Derived from the log file path.
    - name: app.name
      type: keyword
      description: >-
        Name of the ServerPilot app the request was served for. Derived from the log file path.
    - name: app.qualified_name
      type: keyword
      description: >-
        Host-qualified app name, `HOST/APP`, built from `host.name` and `serverpilot.app.name`, for example `web-01/0default`. App names are only unique per server and every ServerPilot server has a `0default` app, so use this field to count or group apps across several hosts. Unset when either part is unknown.
    - name: nginx.upstream.response.bytes
      type: long
      unit: byte
      description: >-
        Total length in bytes of the responses Nginx obtained from the upstream server. When Nginx retried a failed upstream the lengths of all attempts are summed. Not set when Nginx served the response itself, for example for static files, or when no attempt reported a length.
    - name: nginx.upstream.response.duration
      type: long
      unit: nanos
      description: >-
        Total time in nanoseconds Nginx spent receiving responses from the upstream server. When Nginx retried a failed upstream the times of all attempts are summed. Not set when Nginx served the response itself, for example for static files, or when no attempt reported a time.
