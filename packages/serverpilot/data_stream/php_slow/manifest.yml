title: "PHP slow request logs"
type: logs
streams:
  - input: filestream
    title: "PHP slow request logs"
    description: "Collect PHP slow request logs from a ServerPilot-managed server."
    template_path: filestream.yml.hbs
    vars:
      - name: paths
        type: text
        title: Paths
        description: Glob patterns for the log files to collect. The defaults match ServerPilot's per-app log layout for every app on the server.
        multi: true
        required: true
        show_user: true
        default:
          - /srv/users/*/log/*/*_php*.slow.log
      - name: exclude_files
        type: text
        title: Exclude Files
        description: A list of regular expressions to match files to ignore.
        multi: true
        required: false
        show_user: false
        default:
          - \.gz$
      - name: tags
        type: text
        title: Tags
        description: Tags to include in the published event.
        multi: true
        required: false
        show_user: false
        default:
          - serverpilot-php-slow
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        required: false
        show_user: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false
