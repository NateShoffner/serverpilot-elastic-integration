---
description: Pipeline for parsing ServerPilot server inventory records from the ServerPilot management API.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  # The CEL program emits one event per server from `GET /servers`, with the
  # server object encoded as a JSON string in `message`. `apikey` is already
  # dropped in CEL and is never recreated here.
  - json:
      field: event.original
      tag: parse_json
      target_field: json
      if: ctx.event?.original != null

  - rename:
      field: json.id
      tag: rename_server_id
      target_field: serverpilot.server.id
      ignore_missing: true
  - rename:
      field: json.name
      tag: rename_server_name
      target_field: serverpilot.server.name
      ignore_missing: true
      description: >-
        The ServerPilot server name is a label chosen when the server was connected and is not
        necessarily the server's hostname, so it is deliberately not copied into `host.name`.
        On the seven filestream data streams `host.name` is the real hostname reported by the
        agent running on the server, and overwriting that meaning here would create a field
        that looks like a join key between the two halves of the package but is not one.
  - rename:
      field: json.plan
      tag: rename_server_plan
      target_field: serverpilot.server.plan
      ignore_missing: true
  - rename:
      field: json.autoupdates
      tag: rename_server_autoupdates
      target_field: serverpilot.server.autoupdates
      ignore_missing: true
  - rename:
      field: json.firewall
      tag: rename_server_firewall
      target_field: serverpilot.server.firewall
      ignore_missing: true
  - rename:
      field: json.deny_unknown_domains
      tag: rename_server_deny_unknown_domains
      target_field: serverpilot.server.deny_unknown_domains
      ignore_missing: true
  - rename:
      field: json.available_runtimes
      tag: rename_server_available_runtimes
      target_field: serverpilot.server.available_runtimes
      ignore_missing: true

  # `lastaddress` is `null` for a server that has never connected to ServerPilot.
  # The `if` guard is what keeps that case working: `ignore_missing` only covers an
  # absent key, and renaming a key that is present with a null value fails, which
  # would also be the wrong outcome because `serverpilot.server.last_address` is an
  # `ip` field and an `ip` mapping rejects an empty value.
  - rename:
      field: json.lastaddress
      tag: rename_server_last_address
      target_field: serverpilot.server.last_address
      ignore_missing: true
      if: ctx.json?.lastaddress != null

  # `lastconn` and `datecreated` are Unix epoch SECONDS, so the format is `UNIX`
  # and not `UNIX_MS`. Parsing them as milliseconds would place every document in
  # January 1970.
  #
  # Neither timestamp becomes `@timestamp`. These are full-snapshot inventory
  # records with no incremental mode, so the event time is the time the snapshot
  # was collected, which the agent already stamps on the event. Using the creation
  # or last-connection date instead would push every document back to whenever the
  # server was built and make the stream invisible to any recent-time dashboard.
  - date:
      field: json.lastconn
      tag: date_server_last_connection
      target_field: serverpilot.server.last_connection
      formats:
        - UNIX
      if: ctx.json?.lastconn != null
      on_failure:
        - append:
            field: error.message
            tag: append_date_server_last_connection_failure
            value: '{{{_ingest.on_failure_message}}}'
  - date:
      field: json.datecreated
      tag: date_server_created
      target_field: serverpilot.server.created
      formats:
        - UNIX
      if: ctx.json?.datecreated != null
      on_failure:
        - append:
            field: error.message
            tag: append_date_server_created_failure
            value: '{{{_ingest.on_failure_message}}}'

  # `GET /servers` is a point-in-time inventory listing, so `event.kind` is `asset`
  # rather than `event`. `host` is the category because the subject of the record is
  # a server, and `info` is the only type that fits a listing: nothing happened, the
  # record simply describes current state. No `event.outcome` is set for the same
  # reason.
  - set:
      field: event.kind
      tag: set_event_kind
      value: asset
  - append:
      field: event.category
      tag: append_event_category_host
      value: host
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  # `lastaddress` is the address the server last connected to ServerPilot *from*,
  # which is the server's own egress address as seen by the ServerPilot control
  # plane. It is infrastructure metadata about the managed host, not a request
  # client, so it is not copied into `client.ip` or `source.ip` and is not geo or
  # ASN enriched: the package reserves `client.ip` and `client.geo.*` for the real
  # HTTP client of a web request, and filling them with a datacenter egress address
  # would corrupt every dashboard and rule built on them. It is still appended to
  # `related.ip` so the address remains pivotable.
  - append:
      field: related.ip
      tag: append_last_address_to_related_ip
      value: '{{{serverpilot.server.last_address}}}'
      allow_duplicates: false
      if: ctx.serverpilot?.server?.last_address != null

  - remove:
      field: json
      tag: remove_json
      ignore_missing: true
  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
