---
description: Pipeline for parsing ServerPilot system user inventory records from the ServerPilot management API.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  # The CEL program emits one event per system user from `GET /sysusers`, with the
  # system user object encoded as a JSON string in `message`. This endpoint returns
  # no secrets.
  - json:
      field: event.original
      tag: parse_json
      target_field: json
      if: ctx.event?.original != null

  - rename:
      field: json.id
      tag: rename_sysuser_id
      target_field: serverpilot.sysuser.id
      ignore_missing: true
  - rename:
      field: json.name
      tag: rename_sysuser_name
      target_field: serverpilot.sysuser.name
      ignore_missing: true
      description: >-
        `serverpilot.sysuser.name` is the authoritative vendor field and is spelled
        identically to the field the seven filestream data streams derive from
        `log.file.path`, which is what makes the two halves of the package join.
  - rename:
      field: json.serverid
      tag: rename_server_id
      target_field: serverpilot.server.id
      ignore_missing: true

  # `datecreated` is Unix epoch SECONDS, so the format is `UNIX` and not `UNIX_MS`;
  # parsing it as milliseconds would place every document in January 1970. The API
  # reference documents the field as optional, so the `if` guard keeps a record that
  # omits it from raising an error.
  #
  # It does not become `@timestamp`: `GET /sysusers` is a full-snapshot inventory
  # endpoint, so the event time is the collection time the agent stamps on the event.
  - date:
      field: json.datecreated
      tag: date_sysuser_created
      target_field: serverpilot.sysuser.created
      formats:
        - UNIX
      if: ctx.json?.datecreated != null
      on_failure:
        - append:
            field: error.message
            tag: append_date_sysuser_created_failure
            value: '{{{_ingest.on_failure_message}}}'

  # A ServerPilot system user is a real operating system login account on the
  # managed server, with its own home directory at `/srv/users/<name>`, so ECS
  # `user.name` is exactly what it is. Setting it lets this inventory join the
  # `system` integration's auth and sudo events and makes the records usable from
  # the Security solution's user pivots. The vendor field stays authoritative, which
  # is the same arrangement the package uses for `service.name` and
  # `serverpilot.app.name`.
  #
  # `user.id` is deliberately not set. The ServerPilot `id` is an opaque control
  # plane identifier, not the account's POSIX uid, and the `system` integration puts
  # the numeric uid in `user.id`; writing a different kind of identifier into the
  # same field would break rather than enable correlation.
  - set:
      field: user.name
      tag: set_user_name_from_sysuser_name
      copy_from: serverpilot.sysuser.name
      if: ctx.serverpilot?.sysuser?.name != null

  # `GET /sysusers` is a point-in-time inventory listing, so `event.kind` is `asset`
  # rather than `event`. `iam` is the category because the subject is an account, and
  # `user` plus `info` are the types: the record describes a user object and reports
  # state rather than an action, so no `event.outcome` applies.
  - set:
      field: event.kind
      tag: set_event_kind
      value: asset
  - append:
      field: event.category
      tag: append_event_category_iam
      value: iam
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_user
      value: user
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  - append:
      field: related.user
      tag: append_user_name_to_related_user
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null

  - remove:
      field: json
      tag: remove_json
      ignore_missing: true
  - append:
      field: tags
      tag: append_preserve_original_event_on_error
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
